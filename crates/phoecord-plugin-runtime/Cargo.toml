[package]
name = "phoecord-plugin-runtime"
description = "PhoeCord plugin runtime: loads and sandboxes third-party plugins (WASM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
phoecord-core.workspace = true
phoecord-i18n = { path = "../phoecord-i18n" }
serde = { workspace = true, features = ["derive"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
toml = "0.9"
wasmtime = { version = "38", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }

[dev-dependencies]
# Only for the test that the SDK's API_VERSION matches phoecord-core's.
phoecord-plugin-sdk = { path = "../phoecord-plugin-sdk" }

[lints]
workspace = true

[[bench]]
name = "overhead"
harness = false
