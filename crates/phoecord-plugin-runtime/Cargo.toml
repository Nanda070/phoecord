[package]
name = "phoecord-plugin-runtime"
description = "PhoeCord plugin runtime: loads and sandboxes third-party plugins (WASM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
phoecord-core.workspace = true
phoecord-i18n = { path = "../phoecord-i18n" }
serde = { workspace = true, features = ["derive"] }
toml = "0.9"
wasmtime = { version = "38", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }

[lints]
workspace = true

[[bench]]
name = "overhead"
harness = false
