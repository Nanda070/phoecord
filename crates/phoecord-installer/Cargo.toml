[package]
name = "phoecord-installer"
description = "PhoeCord installer: finds the client, trusts the CA, installs the loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
phoecord-core.workspace = true
# Signature files only (2.2.10); without the DLL itself.
phoecord-loader = { path = "../phoecord-loader", default-features = false }
phoecord-proxy.workspace = true
anyhow.workspace = true
dirs.workspace = true
semver = "1"
serde.workspace = true
serde_json.workspace = true
# `[update] auto` lives in the config's extra keys (a `toml::Table`).
toml = "1"
tracing.workspace = true
# Automatic updates from GitHub Releases (2.4.5): the same client and TLS as the plugin catalog.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
