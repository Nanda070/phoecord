[package]
name = "phoecord-proxy"
description = "PhoeCord network layer: local MITM proxy, gateway codecs, local CA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
phoecord-core.workspace = true
phoecord-plugin-runtime.workspace = true
anyhow.workspace = true
dirs.workspace = true
flate2.workspace = true
rcgen.workspace = true
ring = "0.17"
rustls.workspace = true
time.workspace = true
zstd.workspace = true
serde_json.workspace = true
tracing.workspace = true
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
notify-rust = "4"
serde = { workspace = true }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
toml = "1"
webpki-roots = "1"

[lints]
workspace = true

[dev-dependencies]
phoecord-plugins.workspace = true
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "chain"
harness = false
