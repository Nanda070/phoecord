[package]
name = "phoecord-loader"
description = "PhoeCord native loader: proxy DLL (version.dll / winhttp.dll), AOB scanner, GPUI hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phoecord-core = { workspace = true, optional = true }
phoecord-transport = { workspace = true, optional = true }
phoecord-plugin-runtime = { workspace = true, optional = true }
phoecord-plugins = { workspace = true, optional = true }
phoecord-i18n = { path = "../phoecord-i18n", optional = true }
serde.workspace = true
serde_json.workspace = true
memchr = "2"
sha2 = "0.11"
toml = "1.2"

[target.'cfg(windows)'.dependencies]
retour = { version = "0.3", default-features = false, optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }


[features]
# The DLL itself: `DllMain`, export forwarding, hooks. The proxy depends on this crate without it,
# for the IPC protocol and the pipe server only.
default = ["dll"]
dll = [
    "dep:retour",
    "dep:phoecord-core",
    "dep:phoecord-transport",
    "dep:phoecord-plugin-runtime",
    "dep:phoecord-plugins",
    "dep:phoecord-i18n",
]

[dev-dependencies]
phoecord-plugin-runtime.workspace = true
phoecord-plugins.workspace = true
tempfile = "3"

[lints]
workspace = true
