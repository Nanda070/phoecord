# Out-of-tree research project (stage 1.6.2). Not a member of the PhoeCord workspace.
[package]
name = "gpui-reference"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "f126950f9d3b62666f97437ae5d4ccac2272c4db" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f126950f9d3b62666f97437ae5d4ccac2272c4db" }

# Shaped like a shipping app, as Discord's Rust client is expected to be.
[profile.release]
lto = "fat"
strip = true
codegen-units = 1
panic = "unwind"
opt-level = 3

[workspace]
