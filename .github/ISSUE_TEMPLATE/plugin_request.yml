name: Plugin
description: Suggest a plugin (a Vencord port or a new one)
title: "plugin: "
labels: [plugin]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: ClearURLs
    validations:
      required: true
  - type: input
    id: vencord
    attributes:
      label: Vencord equivalent
      description: A link to the Vencord plugin, if this is a port.
      placeholder: https://vencord.dev/plugins/ClearURLs
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: The behaviour from the user's point of view.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: "Network if REST and Gateway are enough (preferred). UI if it has to draw inside the client. See ARCHITECTURE.md."
      options:
        - Network (REST / Gateway)
        - Theme (palette, fonts)
        - UI (hooks in the client)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: events
    attributes:
      label: Events it needs
      description: REST routes, Gateway events or ops the plugin reads or changes.
      placeholder: "POST /channels/{id}/messages: rewrite content\nMESSAGE_CREATE: ..."
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The plugin is not in the ROADMAP.md table
          required: true
        - label: I am willing to write it myself
