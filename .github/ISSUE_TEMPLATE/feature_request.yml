name: Feature
description: Suggest something for the core, proxy, loader or installer
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: A new plugin? Use the "Plugin" template. Check [ROADMAP.md](https://github.com/nanda070/phoecord/blob/main/ROADMAP.md) first, it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is inconvenient or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it should work. If the Plugin API changes, which types and why.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - core (Plugin API)
        - proxy
        - plugin-runtime / SDK
        - loader
        - installer
        - cli
        - localization
        - docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else you considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for similar issues and for an item in ROADMAP.md
          required: true
