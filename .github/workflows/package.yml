name: Package

# Native installers for the installer window: setup .exe (NSIS) and .msi (WiX) on Windows,
# PhoeCord.app in a .dmg on macOS. The macOS app is ad-hoc signed (no certificate), so Gatekeeper says "unidentified developer" instead of "damaged"; nothing else is signed. The files are kept as
# workflow artifacts for 14 days. release.yml calls this workflow (workflow_call) on a `v*` tag and
# attaches the installers to the GitHub release, so there is no tag trigger here.

on:
  pull_request:
    paths:
      - "crates/phoecord-installer-gui/**"
      - "crates/phoecord-installer/**"
      - "crates/phoecord-cli/**"
      - "scripts/package/**"
      - ".github/workflows/package.yml"
      - "Cargo.lock"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis wix
          - os: macos-latest
            formats: app dmg
          - os: macos-15-intel
            formats: app dmg
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --locked --version "$PACKAGER_VERSION"
      - name: Build the installers
        shell: bash
        working-directory: crates/phoecord-installer-gui
        run: |
          args=()
          for f in ${{ matrix.formats }}; do args+=(-f "$f"); done
          cargo packager --release "${args[@]}"
      - name: Sign the app (ad hoc) and refresh the .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/package/sign-macos.sh target/packages
      - name: Verify the signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 target/packages/PhoeCord.app
          dmg=$(ls target/packages/*.dmg | head -n1)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          codesign --verify --deep --strict --verbose=2 "$mnt/PhoeCord.app"
          hdiutil detach "$mnt" -quiet
      - name: Name the files
        shell: bash
        run: bash scripts/package/name-files.sh target/packages
      - name: SHA256SUMS
        shell: bash
        working-directory: target/packages
        run: |
          rm -rf PhoeCord.app
          # Git Bash on Windows ships sha256sum but not shasum; macOS has shasum.
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec $sum {} + | sed 's#\./##' | tee SHA256SUMS-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: phoecord-installers-${{ matrix.os }}
          path: |
            target/packages/*.exe
            target/packages/*.msi
            target/packages/*.dmg
            target/packages/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
