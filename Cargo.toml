[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["research", "examples"]
default-members = ["crates/phoecord-cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/nanda070/phoecord"
authors = ["Cheterin Group"]

[workspace.dependencies]
# Internal crates
phoecord-core = { path = "crates/phoecord-core" }
phoecord-proxy = { path = "crates/phoecord-proxy" }
phoecord-transport = { path = "crates/phoecord-transport" }
phoecord-plugin-runtime = { path = "crates/phoecord-plugin-runtime" }
phoecord-plugins = { path = "crates/phoecord-plugins" }

# External dependencies
anyhow = "1"
dirs = "7"
flate2 = "1"
# Decoding and encoding images in plugins (petpet): PNG and JPEG avatars, GIF frames.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
tracing = "0.1"
# Icon and version resources in the Windows .exe files (build scripts only).
winresource = { version = "0.1", default-features = false }
zstd = "0.14"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
