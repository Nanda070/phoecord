# Template for a WASM plugin manifest. Copy next to your plugin.wasm; the full reference is docs/plugins/.
# Unknown fields are an error: only the fields below exist.

id = "my_plugin"                 # snake_case, unique; also the [plugins.<id>] config section
name = "MyPlugin"
version = "0.1.0"
api = 1                          # phoecord_core::plugin::API_VERSION the plugin was built for
description = "What it does, in one English sentence"
authors = ["Your Name"]
vencord = "VencordName"          # optional: the Vencord plugin this mirrors
layers = ["network"]             # network | theme | ui

# Only these events reach the plugin: `kind` or `kind:glob` (`*` any text, `?` one character).
#   rest_request / rest_response: "METHOD route" with one space, e.g. "rest_request:POST /channels/*/messages"
#   dispatch: the event name, e.g. "dispatch:MESSAGE_*"; send: the op number, e.g. "send:3"
#   ui: the UI event name, e.g. "ui:menu_action"
events = [
    "rest_request:POST /channels/*/messages",
    "dispatch:MESSAGE_CREATE",
]

# Rights beyond events. Anything not listed is denied.
rights = ["kv", "notify"]

# Outside hosts for the `fetch` right ("*.example.com" matches exactly one more label).
# fetch = ["api.example.com"]

# Message context menu entries (Phoenix). List "ui:menu_action" in `events` to receive the clicks.
# [[menu]]
# id = "example_action"          # snake_case, unique in the plugin
# label = "menu-example-action"  # a key of i18n/<lang>.ftl, shown through Host::t

# Settings shown in the PhoeCord settings tab (task 2.3.3), in this order. The user's values still live
# under [plugins.<id>] in config.toml and the plugin reads them with Host::setting; this only describes them.
# [[setting]]
# key = "example_mode"           # the config key, unique in the plugin
# kind = "choice"                # bool, number, text, choice (needs `options`) or list (of strings)
# default = "fast"               # must fit the kind; a choice's default is one of `options`
# options = ["fast", "exact"]    # strings or numbers
# label = "setting-example-mode" # a key of i18n/<lang>.ftl, shown through Host::t
# Strings are i18n/en.ftl and i18n/ru.ftl next to this file.
